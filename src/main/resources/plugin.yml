name: Cigaro
version: '${version}'
main: com.cigaro.Cigaro
api-version: '26.3'
description: Light up. Or don't.

commands:
  cigaro:
    description: Cigaro main command
    usage: /cigaro [stats|reload]

permissions:
  cigaro.use:
    description: Use Cigaro features
    default: true
  cigaro.admin:
    description: Admin commands
    default: op