plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.1.0"
}

group = 'com.cigaro'
version = '1.1.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.211-stable")
    compileOnly("org.xerial:sqlite-jdbc:3.46.1.3")
}

tasks {
    runServer {
        minecraftVersion("26.3")
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion.set(JavaLanguageVersion.of(25))
        })
    }
}

tasks.register('resourcePackZip', Zip) {
    archiveFileName = "Cigaro-ResourcePack-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from 'resourcepack/cigaro_rp'
    from 'LICENSE'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    from 'LICENSE'
}

tasks.named('build') {
    dependsOn tasks.named('resourcePackZip')
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = true

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

tasks.register('blendCompatibilityCheck', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath + sourceSets.main.compileClasspath
    mainClass = 'com.cigaro.data.BlendCompatibilityCheck'
}
tasks.named('check') { dependsOn tasks.named('blendCompatibilityCheck') }
tasks.named('test') { failOnNoDiscoveredTests = false }
